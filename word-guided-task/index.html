<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Word Guided Task</title>
<style>
  :root{
    --gray-label: #8a8a8a;
    --gray-line: #e3e3e3;
    --board-bg: #ffffff;
    --word-size: 283px;
  }
  *{box-sizing:border-box;}
  html, body{
    margin:0;
    height:100%;
    overflow:hidden;
    background:#ffffff;
  }
  body{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;
    color:#222;
  }

  /* ---------------------------------------------------------------
     Fixed-size design stage. The whole task is authored once at a
     single fixed pixel size (STAGE_W x STAGE_H, kept in sync with the
     JS constants below) and never reflows or re-wraps its own
     internal layout. To "adapt" to whatever window the participant
     actually has, JS uniformly scales this single stage up or down
     (via a CSS transform) so it always fits the viewport -- the
     layout itself is identical at every window size, just bigger or
     smaller, which is what keeps every element in the same relative
     position and avoids the overlap/collision bugs that responsive
     reflow (text wrapping, elements dropping to new rows, etc.) can
     produce. The stage keeps its landscape proportions no matter how
     tall/narrow the window gets -- it is scaled down to fit, never
     rotated or restacked into a portrait/column layout. ---------- */
  #stageOuter{
    position:fixed;
    inset:0;
    width:100vw;
    height:100vh;
    overflow:hidden;
  }
  #stage{
    position:absolute;
    top:50%;
    left:50%;
    width:1550px;
    height:800px;
    transform-origin:center center;
  }
  .wrap{
    width:100%;
    height:100%;
    margin:0 auto;
    position:absolute;
    top:0; left:0;
    padding:14px 16px 18px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
  }

  .box-unit{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:5px;
  }
  .box-caption{
    font-size:12px;
    color:var(--gray-label);
    min-height:15px;
  }
  .box{
    background:var(--board-bg);
    border:1px solid var(--gray-line);
    border-radius:4px;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:visible;
  }
  .box svg{overflow:visible;}
  /* Every shape is drawn inside a <g> that gets rotated/shaken around a
     specific pivot (transform-origin, set inline per-shape in JS to the
     shape's own true center). That pivot is only correct if it's read
     against the SVG's own viewport coordinates ("view-box") rather than
     the <g>'s own painted bounding box ("fill-box", which is what some
     engines fall back to for SVG elements when this isn't set at all).
     Those two only coincide for shapes whose bounding box happens to be
     centered on their own visual center -- true for the square and
     oval here, but never true for a triangle (its apex sits a full
     radius above its own bbox center) -- so an unspecified default
     would rotate a triangle around the wrong point and swing it
     visibly outside its box, while every other shape looked fine.
     This has to be a real stylesheet rule, not inline style on the
     <g> itself: setting transform-box via a string passed through
     innerHTML gets silently dropped by at least one engine's SVG
     inline-style parsing, even though the property is fully supported
     and takes effect immediately if set via the CSSOM afterward. A
     stylesheet rule doesn't go through that parsing path. */
  .box svg g, .opt svg g{ transform-box: view-box; }
  /* fixed across every trial -- only the shape drawn inside changes. */
  #shapeBox, #sandboxBox, #shapeOnlyBox, #instr3ShapeBox{ width:200px; height:200px; }

  /* the square where the target's descriptive words float continuously
     -- always visible, no transition or separate "question" step.
     Area is doubled relative to the original 200x200 (~283x283),
     clamped so it never pushes the task past one screen. */
  .word-square{
    position:relative;
    width:var(--word-size);
    height:var(--word-size);
    background:var(--board-bg);
    border:1px solid var(--gray-line);
    border-radius:4px;
    overflow:hidden;
  }
  .word-float{
    position:absolute;
    inset:0;
    overflow:hidden;
    pointer-events:none;
  }
  .wf-word{
    position:absolute;
    top:0;
    left:0;
    font-size:12px;
    font-weight:600;
    letter-spacing:.01em;
    color:#555;
    background:#f4f4f4;
    border-radius:12px;
    padding:4px 10px;
    white-space:nowrap;
  }

  /* core: target box + yours box, held fixed at the pentagon's center,
     placed in a row so they always sit in line with each other --
     their position/size never move between trials, only what's drawn
     inside them changes. */
  .core-stack{
    position:absolute;
    top:50%; left:50%;
    transform:translate(-50%,-50%);
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:10px;
  }
  /* pentagon: five fixed vertex positions wrap around the whole
     core. WHICH property lands in which vertex is reshuffled every
     trial in JS -- these five positions themselves never move. */
  .pentagon-wrap{
    position:relative;
    width:780px;
    aspect-ratio:160/150;
    margin:0 auto;
  }
  .pent-slot{
    position:absolute;
    transform:translate(-50%,-50%);
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
    width:160px;
  }
  .pent-0{ top:4%;    left:50%;   }
  .pent-1{ top:32%;   left:89%;   }
  .pent-2{ top:88%;   left:75%;   }
  .pent-3{ top:88%;   left:25%;   }
  .pent-4{ top:32%;   left:11%;   }

  .prop-options{
    display:flex;
    gap:8px;
  }
  .opt-unit{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:4px;
    user-select:none;
    -webkit-user-select:none;
    -moz-user-select:none;
  }
  .opt-label{
    font-size:13px;
    color:var(--gray-label);
    text-align:center;
    min-height:14px;
    user-select:none;
    -webkit-user-select:none;
    -moz-user-select:none;
  }

  .board-actions{
    display:flex;
    justify-content:center;
    gap:10px;
    margin-top:14px;
  }
  button.action{
    font-family:inherit;
    font-size:13px;
    font-weight:600;
    letter-spacing:.02em;
    border:none;
    border-radius:5px;
    padding:8px 18px;
    cursor:pointer;
  }
  button.action:hover{opacity:.85;}
  button.action:disabled{ opacity:.4; cursor:not-allowed; }
  button.submit{background:#111;color:#fff;}

  .opt{
    background:#fff;
    border:2px solid var(--gray-line);
    border-radius:8px;
    padding:5px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    line-height:0;
    flex:0 0 auto;
    width:70px;
    height:70px;
    transition:border-color .15s ease;
  }
  .opt svg{width:56px;height:56px;display:block;}
  .opt.selected{border-color:#111;}

  /* motion animations, applied to the <g> wrapping the shape. */
  .m-rotate{ animation: rotateAnim 3s linear infinite; }
  .m-shake{  animation: shakeAnim 0.5s ease-in-out infinite; }

  @keyframes rotateAnim{
    from{transform:rotate(0deg);}
    to{transform:rotate(360deg);}
  }
  @keyframes shakeAnim{
    0%,100%{transform:rotate(-9deg);}
    50%{transform:rotate(9deg);}
  }

  /* ---- instruction pages ---- */
  .intro-top{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:220px;
    margin:10px 0 22px;
    flex-wrap:nowrap;
  }
  /* matches --word-size (task-target-col's rendered width on page 3 and
     the task) so every page's row has the same total width -- intro-top
     centers the row as a block, so a mismatched column width here would
     shift the whole row (and the box/pentagon in it) sideways relative
     to page 3 and the task. */
  .intro-left{
    flex:0 0 var(--word-size);
    max-width:var(--word-size);
    text-align:left;
    display:flex;
    flex-direction:column;
    gap:4px;
  }
  .intro-right{
    flex:0 0 auto;
    display:flex;
    justify-content:center;
  }
  .sandbox-pentagon{
    width:640px;
  }
  /* used on instruction pages 1 & 3 so their visual area occupies the
     same footprint/proportions as page 2's pentagon, just with a
     single element centered inside instead of the full pentagon */
  .static-frame{
    width:640px;
    aspect-ratio:160/150;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .screen-title{ font-size:20px; margin:0 0 6px; }
  .screen-text{ font-size:15px; line-height:1.65; color:#333; margin:0; }
  .sandbox-progress{ font-size:13px; color:var(--gray-label); margin-top:12px; }
  .intro-left .board-actions{ justify-content:flex-start; margin-top:14px; }

  /* the task's target box sits outside the pentagon, to its left, in
     line with the Yours box at the pentagon's center -- it isn't a
     text column, so it shouldn't inherit the 220px text-column cap */
  .task-target-col{
    flex:0 1 auto;
    max-width:none;
    display:flex;
    justify-content:center;
    position:relative;
  }

  /* ---- progress bar (task screen) -- small, sits above the target
     box only, so it never spans the whole task width. ---- */
  .progress-wrap{ width:var(--word-size); margin:0 0 8px; }
  .progress-label{ font-size:10px; font-weight:600; color:var(--gray-label); margin-bottom:3px; }
  .progress-track{ width:100%; height:5px; background:var(--gray-line); border-radius:3px; overflow:hidden; }
  .progress-fill{ height:100%; background:#111; width:0%; transition:width .3s ease; }

  /* ---- instruction pages: full-width text sits above the visual
     row, and the visual row itself reuses the exact same
     target-col + pentagon layout as the real task, so nothing
     shifts position as the participant moves from page to page. ---- */
  .instr-header{ max-width:820px; margin:0 auto 18px; text-align:left; }
  .instr-header .screen-title{ margin:0 0 6px; }
  .instr-header .screen-text{ margin:0; }
  /* page 3 is the only instruction page where text sits above the
     visual instead of beside it. Its visual row below reuses the
     exact same box/pentagon classes (and therefore sizes/positions)
     as page 2 and the task, so it must land at the exact same x/y --
     which means the header can't take any flow height away from it
     (that's what was pushing the row down) and can't reach sideways
     into the pentagon's column either. Taking it out of flow entirely
     (absolute, anchored above the target column specifically) lets it
     sit in the negative space that column already leaves empty above
     itself -- inset the same amount as the column, so it never nears
     the stage edges -- without moving or widening anything else. */
  .instr3-header{
    position:absolute;
    left:0; bottom:100%;
    width:480px;
    margin:0 0 16px;
    text-align:left;
  }
  .instr3-header .screen-title{ margin:0 0 6px; }
  .instr3-header .screen-text{ margin:0; }

  .build-caption{
    font-size:15px;
    font-weight:700;
    color:#333;
    margin-bottom:2px;
    text-align:center;
  }
  .shape-name-label{
    font-size:15px;
    font-weight:700;
    color:#333;
    text-align:center;
  }

  /* ---- alignment + even-margin fix: the word-square (target) box and
     the "Yours" box must (a) share the exact same vertical center,
     since they sit in the same row, and (b) have equal breathing room
     above and below themselves. Their surrounding chrome differs in
     kind -- progress bar + caption above the word box, caption +
     button below the Yours box -- and those two chrome blocks are
     different heights, so naturally-sized content can't satisfy both
     goals at once.

     Fix: give every box a reserved slot of the SAME fixed height
     above it and below it, on BOTH columns (mirroring whichever slot
     doesn't have real content, invisibly, so the layout stays
     symmetric). Content packs toward the box; any slack goes to the
     outer edge. Because both columns end up with identical
     [top-slot][box][bottom-slot] structure and height, the boxes
     align by construction -- no absolute positioning needed -- and
     the box-to-box gap is identical on every side. ---- */
  .box-unit.chrome-managed{ gap:5px; }
  .chrome-slot{
    width:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
  }
  .chrome-top{ justify-content:flex-end; gap:8px; height:60px; }
  .chrome-bottom{ justify-content:flex-start; gap:14px; height:60px; }
  .chrome-hidden{ visibility:hidden; }
</style>
</head>
<body>
<div id="stageOuter"><div id="stage">

<!-- Instruction page 1: text + the sandbox area showing only the plain
     shape outline -- no properties, no property boxes, no labels. -->
<div class="wrap" id="instr1">
  <div class="intro-top">
    <div class="intro-left">
      <h2 class="screen-title">How this task works</h2>
      <p class="screen-text" id="instr1Text"></p>
      <div class="board-actions">
        <button class="action submit" onclick="goToPage(2)">Continue</button>
      </div>
    </div>
    <div class="intro-right">
      <div class="static-frame">
        <div class="box-unit">
          <div class="box" id="shapeOnlyBox"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Instruction page 2: adds the live properties + additional explanation. -->
<div class="wrap" id="instr2" style="display:none;">
  <div class="intro-top">
    <div class="intro-left">
      <h2 class="screen-title">Building your shape</h2>
      <p class="screen-text" id="instr2Text"></p>
      <div class="sandbox-progress" id="sandboxProgress">0 of 10 options tried</div>
      <div class="board-actions">
        <button class="action submit" id="sandboxContinueBtn" disabled onclick="goToPage(3)">Continue</button>
      </div>
    </div>
    <div class="intro-right">
      <div class="pentagon-wrap sandbox-pentagon" id="sandboxPentagonWrap">
        <div class="pent-slot pent-0" id="sandbox-prop-slot-0"></div>
        <div class="pent-slot pent-1" id="sandbox-prop-slot-1"></div>
        <div class="pent-slot pent-2" id="sandbox-prop-slot-2"></div>
        <div class="pent-slot pent-3" id="sandbox-prop-slot-3"></div>
        <div class="pent-slot pent-4" id="sandbox-prop-slot-4"></div>

        <div class="core-stack">
          <div class="box-unit">
            <div class="box" id="sandboxBox"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Instruction page 3: shows an appropriate target box from the task
     (the floating-words box), with a short note on why it matters. -->
<div class="wrap" id="instr3" style="display:none;">
  <div class="intro-top" style="justify-content:center;align-items:center;">
    <div class="intro-left task-target-col">
      <div class="instr3-header">
        <h2 class="screen-title">What you'll be matching</h2>
        <p class="screen-text" id="instr3Text"></p>
      </div>
      <div class="box-unit chrome-managed">
        <div class="chrome-slot chrome-top">
          <div class="build-caption">Build a...</div>
        </div>
        <div class="word-square" id="sampleTargetSquare">
          <div class="word-float" id="sampleTargetFloat"></div>
        </div>
        <div class="chrome-slot chrome-bottom">
          <div class="shape-name-label" id="instr3TargetShapeName"></div>
        </div>
      </div>
    </div>
    <div class="intro-right">
      <div class="pentagon-wrap sandbox-pentagon">
        <div class="pent-slot pent-0" id="instr3-prop-slot-0"></div>
        <div class="pent-slot pent-1" id="instr3-prop-slot-1"></div>
        <div class="pent-slot pent-2" id="instr3-prop-slot-2"></div>
        <div class="pent-slot pent-3" id="instr3-prop-slot-3"></div>
        <div class="pent-slot pent-4" id="instr3-prop-slot-4"></div>
        <div class="core-stack">
          <div class="box-unit chrome-managed">
            <div class="chrome-slot chrome-top chrome-hidden" aria-hidden="true">
              <div class="build-caption">Build a...</div>
            </div>
            <div class="box" id="instr3ShapeBox"></div>
            <div class="chrome-slot chrome-bottom">
              <div class="board-actions" style="margin-top:0;">
                <button class="action submit" id="startTaskBtn" disabled onclick="goToTask()">Start task</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Screen 4: the task itself -->
<div class="wrap" id="taskWrap" style="display:none;">
  <div class="intro-top" style="justify-content:center;align-items:center;">
    <div class="intro-left task-target-col">
      <div class="box-unit chrome-managed">
        <div class="chrome-slot chrome-top">
          <div class="progress-wrap" style="margin:0;">
            <div class="progress-label">Progress</div>
            <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
          </div>
          <div class="build-caption">Build a...</div>
        </div>
        <div class="word-square" id="wordSquare">
          <div class="word-float" id="wordFloat"></div>
        </div>
        <div class="chrome-slot chrome-bottom">
          <div class="shape-name-label" id="targetShapeName"></div>
        </div>
      </div>
    </div>
    <div class="intro-right">
      <div class="pentagon-wrap sandbox-pentagon" id="pentagonWrap">
        <div class="pent-slot pent-0" id="prop-slot-0"></div>
        <div class="pent-slot pent-1" id="prop-slot-1"></div>
        <div class="pent-slot pent-2" id="prop-slot-2"></div>
        <div class="pent-slot pent-3" id="prop-slot-3"></div>
        <div class="pent-slot pent-4" id="prop-slot-4"></div>

        <div class="core-stack">
          <div class="box-unit chrome-managed">
            <div class="chrome-slot chrome-top chrome-hidden" aria-hidden="true">
              <div class="progress-wrap" style="margin:0;">
                <div class="progress-label">Progress</div>
                <div class="progress-track"><div class="progress-fill"></div></div>
              </div>
              <div class="build-caption">Build a...</div>
            </div>
            <div class="box" id="shapeBox"></div>
            <div class="chrome-slot chrome-bottom">
              <div class="board-actions" style="margin-top:0;">
                <button class="action submit" id="nextBtn" onclick="submitTrial()">Next</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

</div></div>

<script>
/* ---------------------------------------------------------------
   Config: shapes and the five binary property dimensions. This list
   never changes trial to trial; only slot/option ORDER is shuffled.
   Each option also carries a "word" -- the adjective shown floating
   in the word-square below the build box, describing the TARGET's
   actual value for that property.
---------------------------------------------------------------- */
const SHAPES = ['triangle','oval','square'];

const CATEGORIES = [
  { key:'size',      label:'Size',       options:[ {id:'small', label:'Small', word:'small'}, {id:'large', label:'Large', word:'large'} ] },
  { key:'texture',   label:'Texture',    options:[ {id:'striped', label:'Striped', word:'striped'}, {id:'dotted', label:'Dotted', word:'dotted'} ] },
  { key:'color',     label:'Color',      options:[ {id:'purple', label:'Purple', word:'purple'}, {id:'yellow', label:'Yellow', word:'yellow'} ] },
  { key:'lineWidth', label:'Line Width', options:[ {id:'thick', label:'Thick', word:'thick'}, {id:'thin', label:'Thin', word:'thin'} ] },
  { key:'motion',    label:'Motion',     options:[ {id:'shake', label:'Shaking', word:'shaking'}, {id:'rotate', label:'Spinning', word:'spinning'} ] }
];

function colorHex(id){
  if(id === 'purple') return '#8E24AA';
  if(id === 'yellow') return '#CC9A06';
  if(id === 'black')  return '#111111';
  return '#9a9a9a'; // neutral / not-yet-chosen (live build only, never an icon)
}

function lineWidthUnits(id){
  // in "board units", i.e. relative to a 100-unit domain half-size;
  // scaled per-domain (board vs icon) at the call site.
  if(id === 'thick') return 7;
  if(id === 'thin')  return 1.3;
  return 4; // default, before a line-width option is chosen
}

/* ---------------------------------------------------------------
   Texture fills: patterns only, never a flat solid fill, so the
   shape always reads as an outline rather than a solid block.
---------------------------------------------------------------- */
function textureFill(texture, colorId, context){
  if(!texture) return { fill:'none', def:'' };
  const color = colorHex(colorId);
  const id = `pat_${context}_${texture}_${colorId||'neutral'}`;
  let def = '';
  if(texture === 'striped'){
    def = `<pattern id="${id}" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="6" height="6" fill="white"/>
      <rect x="0" width="3" height="6" fill="${color}"/>
    </pattern>`;
  } else if(texture === 'dotted'){
    const w = 10, h = 10, r = 3.6;
    def = `<pattern id="${id}" width="${w}" height="${h}" patternUnits="userSpaceOnUse">
      <rect width="${w}" height="${h}" fill="white"/>
      <circle cx="${w/2}" cy="${h/2}" r="${r}" fill="${color}"/>
    </pattern>`;
  }
  return { fill:`url(#${id})`, def };
}

/* ---------------------------------------------------------------
   Shape geometry. Every shape is drawn from a single circumradius R
   (max distance from center) around (cx,cy).
---------------------------------------------------------------- */
function starPoints(cx,cy,rOuter,rInner,n=5){
  let pts=[];
  for(let i=0;i<n*2;i++){
    const r = i%2===0 ? rOuter : rInner;
    const a = (Math.PI/n)*i - Math.PI/2;
    pts.push(`${(cx+r*Math.cos(a)).toFixed(1)},${(cy+r*Math.sin(a)).toFixed(1)}`);
  }
  return pts.join(' ');
}

function regularPolygonPoints(cx,cy,r,n){
  let pts=[];
  for(let i=0;i<n;i++){
    const a = -Math.PI/2 + i*(2*Math.PI/n);
    pts.push(`${(cx+r*Math.cos(a)).toFixed(1)},${(cy+r*Math.sin(a)).toFixed(1)}`);
  }
  return pts.join(' ');
}

function shapeElement(shape, cx, cy, R, styleAttrs){
  switch(shape){
    case 'oval': {
      const ry = R * 0.62;
      return `<ellipse cx="${cx}" cy="${cy}" rx="${R.toFixed(2)}" ry="${ry.toFixed(2)}" ${styleAttrs}/>`;
    }
    case 'square': {
      const hw = R / Math.SQRT2;
      const rx = Math.max(1, hw*0.11);
      return `<rect x="${(cx-hw).toFixed(2)}" y="${(cy-hw).toFixed(2)}" width="${(hw*2).toFixed(2)}" height="${(hw*2).toFixed(2)}" rx="${rx.toFixed(2)}" ${styleAttrs}/>`;
    }
    case 'triangle': return `<polygon points="${regularPolygonPoints(cx,cy,R,3)}" ${styleAttrs}/>`;
    case 'diamond':  return `<polygon points="${cx},${(cy-R).toFixed(2)} ${(cx+R).toFixed(2)},${cy} ${cx},${(cy+R).toFixed(2)} ${(cx-R).toFixed(2)},${cy}" ${styleAttrs}/>`;
    case 'star':     return `<polygon points="${starPoints(cx,cy,R,R*0.4)}" ${styleAttrs}/>`;
  }
}

/* ---------------------------------------------------------------
   Size model: both the boxes (200x200 viewBox) and the icons (120x120
   viewBox) share the same SIZE_FRACTION.
---------------------------------------------------------------- */
const SIZE_FRACTION = { small: 0.22, default: 0.55, large: 0.93 };

const ANIM_DURATIONS = { rotate: 3, shake: 0.5 };
const ANIM_TIME_ORIGIN = performance.now();

function motionStyle(motion){
  if(!motion) return '';
  const duration = ANIM_DURATIONS[motion];
  const elapsed = (performance.now() - ANIM_TIME_ORIGIN) / 1000;
  const phase = ((elapsed % duration) + duration) % duration;
  return `animation-delay:-${phase.toFixed(3)}s;`;
}

function specToSvg(spec, cx, cy, context, strokeMultiplier=1){
  const domainHalf = cx; // cx === cy === this domain's own half-size (100 for boxes, 60 for icons)
  const R = domainHalf * (SIZE_FRACTION[spec.size] || SIZE_FRACTION.default);
  const strokeColor = colorHex(spec.color);
  const strokeWidth = lineWidthUnits(spec.lineWidth) * (domainHalf / 100) * strokeMultiplier;
  const fillInfo = textureFill(spec.texture, spec.color, context);

  const outlineR = R + strokeWidth / 2;

  // An equilateral triangle's centroid (which is also its circumcircle's
  // center, i.e. what regularPolygonPoints draws around) sits ABOVE the
  // true vertical midpoint of its own bounding box: the apex is a full
  // radius above the centroid, but the flat base is only half a radius
  // below it. Drawing it circumcenter-first at (cx,cy) therefore looks
  // shifted up within a square box. Nudge the center down by a quarter
  // of the outer radius so the bounding box -- not the centroid -- ends
  // up centered on (cx,cy); use the same shift for the fill and outline
  // triangles (based on the outer radius either way) so they stay
  // concentric with each other.
  //
  // BUT only while it's not spinning: the <g> this shape sits in still
  // rotates around the untouched (cx,cy) (renderInto sets that as the
  // transform-origin, not this shifted point), so shifting the triangle
  // away from (cx,cy) turns a spin into an orbit around it instead of a
  // rotation in place -- and that orbit sweeps well outside whatever
  // margin the box has, since the box was only ever sized to fit the
  // shape's own static extent around (cx,cy), not extent-plus-orbit.
  // A continuously spinning triangle doesn't have a single "bounding
  // box" to center in the first place, so there's nothing to fix there
  // -- centering only matters, and is only safe, while it's at rest.
  const shapeCy = (spec.shape === 'triangle' && spec.motion !== 'rotate') ? cy + outlineR * 0.25 : cy;

  const fillEl = shapeElement(spec.shape, cx, shapeCy, R, `fill="${fillInfo.fill}" stroke="none"`);
  const outlineEl = shapeElement(spec.shape, cx, shapeCy, outlineR, `fill="none" stroke="${strokeColor}" stroke-width="${strokeWidth.toFixed(2)}" stroke-linejoin="round"`);

  const motionClass = spec.motion ? ('m-' + spec.motion) : '';
  return { def: fillInfo.def, shapeSvg: fillEl + outlineEl, motionClass, motionStyle: motionStyle(spec.motion) };
}

function renderInto(el, spec, viewBoxSize, cx, cy, context){
  const { def, shapeSvg, motionClass, motionStyle } = specToSvg(spec, cx, cy, context);
  el.innerHTML = `
    <svg viewBox="0 0 ${viewBoxSize} ${viewBoxSize}" width="100%" height="100%">
      <defs>${def}</defs>
      <g class="${motionClass}" style="transform-origin:${cx}px ${cy}px;${motionStyle}">${shapeSvg}</g>
    </svg>
  `;
}

/* ---------------------------------------------------------------
   Property-option icons.
---------------------------------------------------------------- */
const ICON_VB = 120;
const ICON_CENTER = 60;

function iconSvgFor(shape, catKey, optId, context){
  const spec = {
    shape,
    size:'large', texture:null,
    color: (catKey === 'color' ? null : 'black'),
    lineWidth:null, motion:null
  };
  spec[catKey] = optId;
  const strokeMultiplier = (catKey === 'color') ? 2 : 1;
  const { def, shapeSvg, motionClass, motionStyle } = specToSvg(spec, ICON_CENTER, ICON_CENTER, context, strokeMultiplier);
  return `<svg viewBox="0 0 ${ICON_VB} ${ICON_VB}">
    <defs>${def}</defs>
    <g class="${motionClass}" style="transform-origin:${ICON_CENTER}px ${ICON_CENTER}px;${motionStyle}">${shapeSvg}</g>
  </svg>`;
}

function previewIconSvg(catKey, optId){
  return iconSvgFor(state.target.shape, catKey, optId, 'prev_' + catKey + '_' + optId);
}

/* ---------------------------------------------------------------
   Stimulus database: every one of the 2^n * m possible target
   combinations is generated once, up front, as a fixed list.
---------------------------------------------------------------- */
function generateStimulusDatabase(){
  let combos = [{}];
  CATEGORIES.forEach(cat=>{
    const next = [];
    combos.forEach(partial=>{
      cat.options.forEach(opt=>{
        next.push({ ...partial, [cat.key]: opt.id });
      });
    });
    combos = next;
  });
  const db = [];
  SHAPES.forEach(shape=>{
    combos.forEach(propCombo=>{
      db.push({ shape, ...propCombo });
    });
  });
  return db;
}

const STIMULUS_DB = generateStimulusDatabase();
const TOTAL_POSSIBLE_TRIALS = STIMULUS_DB.length;

function pickRandom(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

let stimulusOrder = shuffle(STIMULUS_DB);
let stimulusIndex = 0;

let state = {
  target: null,
  build: { size:null, texture:null, color:null, lineWidth:null, motion:null },
  trialCount: 0,
  slotOrder: [],
  optionOrder: {}
};

let floatAnimHandle = null;
let revealTimeouts = [];

function clearRevealTimeouts(){
  revealTimeouts.forEach(id => clearTimeout(id));
  revealTimeouts = [];
}

const seenTrials = new Set();
function trialKey(target){
  return [target.shape, ...CATEGORIES.map(cat => target[cat.key])].join('|');
}

/* ---------------------------------------------------------------
   Reveal sequence at the start of every trial:
     1. everything disappears for 1 second (blank target box, blank
        build box, blank/hidden property slots)
     2. just the target stimulus (the floating words) appears, alone,
        for 1 second
     3. everything else -- the base (unbuilt) shape and every property
        option -- appears together, all at once
---------------------------------------------------------------- */
const BLANK_MS = 1000;
const TARGET_ONLY_MS = 2000;

function newTrial(){
  if(stimulusIndex >= stimulusOrder.length){
    stimulusOrder = shuffle(STIMULUS_DB);
    stimulusIndex = 0;
  }
  const target = { ...stimulusOrder[stimulusIndex] };
  stimulusIndex += 1;

  state.target = target;
  state.build = { size:null, texture:null, color:null, lineWidth:null, motion:null };
  state.trialCount += 1;
  seenTrials.add(trialKey(target));

  state.slotOrder = shuffle(CATEGORIES.map(c=>c.key));
  state.optionOrder = {};
  CATEGORIES.forEach(cat=>{
    state.optionOrder[cat.key] = shuffle(cat.options.map(o=>o.id));
  });

  clearRevealTimeouts();
  if(floatAnimHandle){ cancelAnimationFrame(floatAnimHandle); floatAnimHandle = null; }

  // Stage 1 (immediate, lasts BLANK_MS): everything disappears -- the
  // build box, the target's words, and every property slot (fully
  // empty, not even empty shells).
  document.getElementById('shapeBox').innerHTML = '';
  document.getElementById('wordFloat').querySelectorAll('.wf-word').forEach(el=>el.remove());
  document.getElementById('targetShapeName').textContent = '';
  clearPropertySlots();
  updateProgress();
  updateNextState();

  // Stage 2 (at BLANK_MS, lasts TARGET_ONLY_MS): just the target
  // stimulus -- the floating words -- appears, alone.
  revealTimeouts.push(setTimeout(()=>{
    const words = CATEGORIES.map(cat=>{
      const opt = cat.options.find(o=>o.id === state.target[cat.key]);
      return opt.word;
    });
    floatAnimHandle = startWordFloatIn('wordFloat', words);
    document.getElementById('targetShapeName').textContent = '... ' +state.target.shape;
  }, BLANK_MS));

  // Stage 3 (at BLANK_MS + TARGET_ONLY_MS): the base (unbuilt) shape
  // and every property option appear together, all at once.
  revealTimeouts.push(setTimeout(()=>{
    renderInto(document.getElementById('shapeBox'), { shape: state.target.shape, ...state.build }, 200, 100, 100, 'build');
    renderProperties();
    updateNextState();
  }, BLANK_MS + TARGET_ONLY_MS));
}

function allPropertiesSelected(){
  return CATEGORIES.every(cat => state.build[cat.key] !== null);
}

// The build only counts as "done" once it exactly matches the target on
// every property -- this is what gates the Next button. Any change away
// from a correct build (even filling in a wrong option) re-disables it,
// since updateNextState() re-runs this check after every selection.
function buildMatchesTarget(){
  return CATEGORIES.every(cat => state.build[cat.key] !== null && state.build[cat.key] === state.target[cat.key]);
}

function submitTrial(){
  if(!buildMatchesTarget()) return; // guard; the button is disabled too
  newTrial();
}

function selectOption(catKey, optId){
  state.build[catKey] = state.build[catKey] === optId ? null : optId;
  render();
}

function render(){
  renderInto(document.getElementById('shapeBox'), { shape: state.target.shape, ...state.build }, 200, 100, 100, 'build');
  renderProperties();
  updateProgress();
  updateNextState();
}

function updateNextState(){
  document.getElementById('nextBtn').disabled = !buildMatchesTarget();
}

function renderProperties(){
  state.slotOrder.forEach((catKey, i)=>{
    const cat = CATEGORIES.find(c=>c.key === catKey);
    const el = document.getElementById('prop-slot-' + i);
    const order = state.optionOrder[catKey];
    const opts = order.map(optId=>{
      const opt = cat.options.find(o=>o.id === optId);
      const selected = state.build[catKey] === optId;
      return `<div class="opt-unit"><button class="opt${selected?' selected':''}" onclick="selectOption('${catKey}','${optId}')">${previewIconSvg(catKey, optId)}</button><div class="opt-label">${opt.label}</div></div>`;
    }).join('');
    el.innerHTML = `<div class="prop-options">${opts}</div>`;
  });
}

// Fully empties every property slot -- used during the 1s blank stage
// at the start of a trial so nothing (not even an empty box outline)
// is visible.
function clearPropertySlots(){
  state.slotOrder.forEach((catKey, i)=>{
    const el = document.getElementById('prop-slot-' + i);
    if(el) el.innerHTML = '';
  });
}

function updateProgress(){
  const pct = Math.min(100, (seenTrials.size / TOTAL_POSSIBLE_TRIALS) * 100);
  document.getElementById('progressFill').style.width = pct + '%';
}

/* ---------------------------------------------------------------
   Word float: a reusable floating-words animation. Given a zone id
   and a list of words, it lays the words out with independent
   trajectories that bounce off the zone's own edges and off each
   other. Returns the requestAnimationFrame handle so callers can
   cancel it later.
---------------------------------------------------------------- */
const WORD_SPEED_MIN = 16;
const WORD_SPEED_MAX = 36;
const WORD_MARGIN = 5;

function bodiesNonOverlap(x, y, w, h, list){
  for(const b of list){
    if(x < b.x + b.w && x + w > b.x && y < b.y + b.h && y + h > b.y) return false;
  }
  return true;
}

function startWordFloatIn(zoneId, words){
  const zone = document.getElementById(zoneId);
  zone.querySelectorAll('.wf-word').forEach(el=>el.remove());

  const wordEls = words.map(word=>{
    const el = document.createElement('div');
    el.className = 'wf-word';
    el.textContent = word;
    zone.appendChild(el);
    return el;
  });

  let handle = null;

  function whenMeasurable(fn){
    // Instruction page 3 calls this while its whole page is still
    // display:none (the very first call, at page load, before the
    // participant ever reaches it) -- offsetWidth/Height read 0 then,
    // since a display:none subtree has no box at all. Spawning words
    // against a fallback size instead just placed them somewhere with
    // no relation to the box's real 281x281 footprint, so the instant
    // the page became visible they were jumbled up in whatever corner
    // the fallback happened to bias toward. Wait for the zone to
    // actually have a measurable size before placing anything in it.
    const zw = zone.offsetWidth, zh = zone.offsetHeight;
    if(zw && zh){ fn(zw, zh); return; }
    handle = requestAnimationFrame(()=> whenMeasurable(fn));
  }

  handle = requestAnimationFrame(()=> whenMeasurable((zw, zh)=>{
    // Use offsetWidth/offsetHeight (unscaled layout size), not
    // getBoundingClientRect (post-transform, scaled by #stage's fit
    // scale) -- translate() below moves words in the same unscaled
    // local space, so bounds must be measured in that same space or
    // words drift outside the box and get clipped by overflow:hidden
    // whenever the stage isn't rendered at exactly 1:1 scale.
    const bodies = [];
    wordEls.forEach(el=>{
      const w = el.offsetWidth || 40;
      const h = el.offsetHeight || 20;
      let x, y, tries = 0, ok;
      do {
        x = WORD_MARGIN + Math.random() * Math.max(1, zw - w - WORD_MARGIN*2);
        y = WORD_MARGIN + Math.random() * Math.max(1, zh - h - WORD_MARGIN*2);
        ok = bodiesNonOverlap(x, y, w, h, bodies);
        tries++;
      } while(!ok && tries < 40);
      const angle = Math.random() * Math.PI * 2;
      const speed = WORD_SPEED_MIN + Math.random() * (WORD_SPEED_MAX - WORD_SPEED_MIN);
      bodies.push({ el, x, y, w, h, vx: Math.cos(angle)*speed, vy: Math.sin(angle)*speed });
    });

    bodies.forEach(b=>{ b.el.style.transform = `translate(${b.x}px, ${b.y}px)`; });

    let lastT = performance.now();

    // `bounce`: when true, a resolved contact also flips/swaps velocity
    // (the physics "feel" -- happens once per frame, on first contact).
    // When false, only position moves (used for the pure geometric
    // clean-up pass below) -- repeatedly swapping velocity every
    // relaxation iteration was itself a bug: it could leave a body's
    // velocity pointing back into the contact that was just resolved,
    // so the very next frame's integration re-created the overlap it
    // had just fixed, on any wall or between any pair.
    function clampToWalls(b, zw2, zh2, bounce){
      if(b.x < WORD_MARGIN){ b.x = WORD_MARGIN; if(bounce) b.vx = Math.abs(b.vx); }
      if(b.x + b.w > zw2 - WORD_MARGIN){ b.x = zw2 - WORD_MARGIN - b.w; if(bounce) b.vx = -Math.abs(b.vx); }
      if(b.y < WORD_MARGIN){ b.y = WORD_MARGIN; if(bounce) b.vy = Math.abs(b.vy); }
      if(b.y + b.h > zh2 - WORD_MARGIN){ b.y = zh2 - WORD_MARGIN - b.h; if(bounce) b.vy = -Math.abs(b.vy); }
    }

    function separatePairs(bounce){
      for(let i=0;i<bodies.length;i++){
        for(let j=i+1;j<bodies.length;j++){
          const a = bodies[i], b = bodies[j];
          const ax=a.x+a.w/2, ay=a.y+a.h/2, bx=b.x+b.w/2, by=b.y+b.h/2;
          const dx = bx-ax, dy = by-ay;
          const minDx = (a.w+b.w)/2 + 4;
          const minDy = (a.h+b.h)/2 + 4;
          if(Math.abs(dx) < minDx && Math.abs(dy) < minDy){
            const overlapX = minDx - Math.abs(dx);
            const overlapY = minDy - Math.abs(dy);
            if(overlapX < overlapY){
              const push = overlapX/2 * (dx < 0 ? -1 : 1);
              a.x -= push; b.x += push;
              if(bounce){ const t = a.vx; a.vx = b.vx; b.vx = t; }
            } else {
              const push = overlapY/2 * (dy < 0 ? -1 : 1);
              a.y -= push; b.y += push;
              if(bounce){ const t = a.vy; a.vy = b.vy; b.vy = t; }
            }
          }
        }
      }
    }

    // A single wall/pair pass, done once with `bounce` on, gives the
    // floating motion its physics feel. But it only resolves ONE
    // constraint at a time, and they can undo each other -- pushing a
    // word off a neighbor can shove it past a wall, and clamping it
    // back to the wall can shove it straight back into that neighbor
    // (or a third word). With just one pass some starting configurations
    // never fully separate and stay visibly stuck: clipped into a wall
    // or overlapping a neighbor, on any side, indefinitely. So after the
    // physics pass, run a purely geometric clean-up -- position only, no
    // velocity change -- for enough iterations that, for a handful of
    // small pills in a much larger box, it always converges to a fully
    // in-bounds, non-overlapping layout before that frame is drawn.
    const POSITION_RELAX_ITERS = 80;

    function tick(now){
      const dt = Math.min(0.05, (now - lastT) / 1000);
      lastT = now;
      const zw2 = zone.offsetWidth || zw, zh2 = zone.offsetHeight || zh;

      bodies.forEach(b=>{
        b.x += b.vx * dt;
        b.y += b.vy * dt;
      });

      bodies.forEach(b=> clampToWalls(b, zw2, zh2, true));
      separatePairs(true);

      for(let iter=0; iter<POSITION_RELAX_ITERS; iter++){
        bodies.forEach(b=> clampToWalls(b, zw2, zh2, false));
        separatePairs(false);
      }
      // separatePairs() is always the last thing each iteration does,
      // including the final one -- so without one more wall pass here,
      // that very last push is never re-checked against the walls
      // before this frame renders.
      bodies.forEach(b=> clampToWalls(b, zw2, zh2, false));

      bodies.forEach(b=>{ b.el.style.transform = `translate(${b.x}px, ${b.y}px)`; });
      handle = requestAnimationFrame(tick);
    }
    handle = requestAnimationFrame(tick);
  }));

  return handle;
}

/* ---------------------------------------------------------------
   Instruction page text.
---------------------------------------------------------------- */
const PAGE1_TEXT = "Welcome! Your job in this task is to build an animation based on some instructions we give you. You'll be given a plain outline shape, and then you’ll be asked to modify it to match a target description. Here's the plain outline you'll start from–nothing has been applied to it yet.";
const PAGE2_TEXT = "Each shape has five properties you can control: size, texture, color, line width, and motion. Click through the options below to see how each one changes the shape–your build updates live. Try every option at least once before continuing.";
const PAGE3_TEXT = "Each trial asks you to make a unique animation. Five words floating inside a box each describe one property of the shape you must build. The order of the properties doesn’t matter; build the animation in whatever way feels most natural to you. But you won’t be able to move on unless you build the shape correctly. Try it now!";

/* ---------------------------------------------------------------
   Page 1: text + plain shape outline only -- no properties, no
   property boxes, no labels.
---------------------------------------------------------------- */
let introShape = pickRandom(SHAPES);

function renderShapeOnly(){
  renderInto(document.getElementById('shapeOnlyBox'), { shape: introShape, size:null, texture:null, color:null, lineWidth:null, motion:null }, 200, 100, 100, 'shapeonly');
}

/* ---------------------------------------------------------------
   Page 2: the interactive sandbox -- same shape as page 1, now with
   live properties. "Tried" = clicked that specific option (10 total).
   Continue unlocks only once all ten have been clicked.
---------------------------------------------------------------- */
let sandboxState = {
  shape: introShape,
  build: { size:null, texture:null, color:null, lineWidth:null, motion:null }
};
const triedOptions = new Set();
const TOTAL_SANDBOX_OPTIONS = CATEGORIES.reduce((n, cat) => n + cat.options.length, 0);

let sandboxSlotOrder = shuffle(CATEGORIES.map(c=>c.key));
let sandboxOptionOrder = {};
CATEGORIES.forEach(cat=>{
  sandboxOptionOrder[cat.key] = shuffle(cat.options.map(o=>o.id));
});

function renderSandbox(){
  renderInto(document.getElementById('sandboxBox'), { shape: sandboxState.shape, ...sandboxState.build }, 200, 100, 100, 'sandbox');

  sandboxSlotOrder.forEach((catKey, i)=>{
    const cat = CATEGORIES.find(c=>c.key === catKey);
    const el = document.getElementById('sandbox-prop-slot-' + i);
    const order = sandboxOptionOrder[catKey];
    const opts = order.map(optId=>{
      const opt = cat.options.find(o=>o.id === optId);
      const selected = sandboxState.build[catKey] === optId;
      const ctx = 'sandbox_' + catKey + '_' + optId;
      return `<div class="opt-unit"><button class="opt${selected?' selected':''}" onclick="sandboxSelect('${catKey}','${optId}')">${iconSvgFor(sandboxState.shape, catKey, optId, ctx)}</button><div class="opt-label">${opt.label}</div></div>`;
    }).join('');
    el.innerHTML = `<div class="prop-options">${opts}</div>`;
  });

  updateSandboxProgress();
}

function sandboxSelect(catKey, optId){
  sandboxState.build[catKey] = sandboxState.build[catKey] === optId ? null : optId;
  triedOptions.add(catKey + ':' + optId);
  renderSandbox();
}

function updateSandboxProgress(){
  const n = triedOptions.size;
  document.getElementById('sandboxProgress').textContent = `${n} of ${TOTAL_SANDBOX_OPTIONS} options tried`;
  document.getElementById('sandboxContinueBtn').disabled = n < TOTAL_SANDBOX_OPTIONS;
}

/* ---------------------------------------------------------------
   Page 3: a sample target box (the same floating-words box used in
   the task), and a "Yours" box + property pentagon that the
   participant actually builds with, same as the real task -- so this
   page doubles as a comprehension check: the "Start task" button
   only unlocks once their build exactly matches the sample words,
   and (just like the real task) changing any option away from a
   correct build re-locks it.
---------------------------------------------------------------- */
let instr3Sample = null;
let instr3Build = { size:null, texture:null, color:null, lineWidth:null, motion:null };

function getInstr3Sample(){
  if(!instr3Sample) instr3Sample = pickRandom(STIMULUS_DB);
  return instr3Sample;
}

function renderSampleTarget(){
  const sample = getInstr3Sample();
  const words = CATEGORIES.map(cat=>{
    const opt = cat.options.find(o=>o.id === sample[cat.key]);
    return opt.word;
  });
  startWordFloatIn('sampleTargetFloat', words);
  document.getElementById('instr3TargetShapeName').textContent = '... ' +sample.shape;
}

function instr3BuildMatchesTarget(){
  const sample = getInstr3Sample();
  return CATEGORIES.every(cat => instr3Build[cat.key] !== null && instr3Build[cat.key] === sample[cat.key]);
}

function instr3Select(catKey, optId){
  instr3Build[catKey] = instr3Build[catKey] === optId ? null : optId;
  renderInstr3Preview();
}

function updateInstr3StartState(){
  document.getElementById('startTaskBtn').disabled = !instr3BuildMatchesTarget();
}

function renderInstr3Preview(){
  const sample = getInstr3Sample();
  renderInto(document.getElementById('instr3ShapeBox'), { shape: sample.shape, ...instr3Build }, 200, 100, 100, 'instr3');

  sandboxSlotOrder.forEach((catKey, i)=>{
    const cat = CATEGORIES.find(c=>c.key === catKey);
    const el = document.getElementById('instr3-prop-slot-' + i);
    const order = sandboxOptionOrder[catKey];
    const opts = order.map(optId=>{
      const opt = cat.options.find(o=>o.id === optId);
      const selected = instr3Build[catKey] === optId;
      const ctx = 'instr3_' + catKey + '_' + optId;
      return `<div class="opt-unit"><button class="opt${selected?' selected':''}" onclick="instr3Select('${catKey}','${optId}')">${iconSvgFor(sample.shape, catKey, optId, ctx)}</button><div class="opt-label">${opt.label}</div></div>`;
    }).join('');
    el.innerHTML = `<div class="prop-options">${opts}</div>`;
  });

  updateInstr3StartState();
}

/* ---------------------------------------------------------------
   Page navigation.
---------------------------------------------------------------- */
function goToPage(n){
  document.getElementById('instr1').style.display = n===1 ? '' : 'none';
  document.getElementById('instr2').style.display = n===2 ? '' : 'none';
  document.getElementById('instr3').style.display = n===3 ? '' : 'none';
  if(n===3) renderInstr3Preview();
}

function goToTask(){
  if(!instr3BuildMatchesTarget()) return; // guard; the button is disabled too
  document.getElementById('instr1').style.display = 'none';
  document.getElementById('instr2').style.display = 'none';
  document.getElementById('instr3').style.display = 'none';
  document.getElementById('taskWrap').style.display = '';
  newTrial();
}

function initInstructions(){
  document.getElementById('instr1Text').textContent = PAGE1_TEXT;
  document.getElementById('instr2Text').textContent = PAGE2_TEXT;
  document.getElementById('instr3Text').textContent = PAGE3_TEXT;
  renderShapeOnly();
  renderSandbox();
  renderSampleTarget();
}

initInstructions();

/* ---------------------------------------------------------------
   Fit the fixed-size stage to whatever window the participant has.
   The stage's own layout never changes -- only its overall scale --
   so nothing ever wraps, stacks, or overlaps differently at
   different window sizes; it just gets bigger or smaller as a whole,
   always keeping its landscape design intact.
---------------------------------------------------------------- */
const STAGE_W = 1550;
const STAGE_H = 800;
function fitStage(){
  const scale = Math.min(window.innerWidth / STAGE_W, window.innerHeight / STAGE_H);
  document.getElementById('stage').style.transform = `translate(-50%,-50%) scale(${scale})`;
}
window.addEventListener('resize', fitStage);
window.addEventListener('orientationchange', fitStage);
fitStage();
</script>
</body>
